[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["docs", "skill"]

[tool.ruff.lint]
# Keep the first pass useful without turning style into a migration project.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These files intentionally alter sys.path and re-export compatibility names.
"labeeb_controller.py" = ["E402", "F401"]
"labeeb/cli/main.py" = ["E402"]
